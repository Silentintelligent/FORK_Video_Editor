name: Build Play bundle (AAB)

# Builds the signed .aab you upload to Google Play Console.
# Secrets needed (Settings > Secrets and variables > Actions):
#   FORK_KEYSTORE            base64 of your upload keystore  (base64 -w0 upload.jks)
#   FORK_KEYSTORE_PASSWORD
#   FORK_KEY_ALIAS
on:
  workflow_dispatch:
    inputs:
      version_code:
        description: Play versionCode (must grow with each upload)
        default: "1"
      version_name:
        description: Version shown to people
        default: "0.1.0"

jobs:
  aab:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - name: Rust toolchain
        run: |
          ch=$(sed -n 's/^channel = "\(.*\)"/\1/p' src/rust-toolchain.toml)
          rustup toolchain install "$ch" --profile minimal
          rustup default "$ch"
          rustup target add aarch64-linux-android
          cargo install cargo-ndk
      - name: System libraries
        run: sudo apt-get update && sudo apt-get install -y cmake libclang-dev
      - name: Android SDK pieces
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.13" }
      - name: Upload keystore
        run: |
          echo "${{ secrets.FORK_KEYSTORE_1 }}${{ secrets.FORK_KEYSTORE_2 }}${{ secrets.FORK_KEYSTORE_3 }}${{ secrets.FORK_KEYSTORE_4 }}" | tr ...
          echo "FORK_KEYSTORE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
      - name: Build
        env:
          FORK_KEYSTORE_PASSWORD: ${{ secrets.FORK_KEYSTORE_PASSWORD }}
          FORK_KEY_ALIAS: ${{ secrets.FORK_KEY_ALIAS }}
        run: ./build-aab.sh "${{ inputs.version_code }}" "${{ inputs.version_name }}"
      - uses: actions/upload-artifact@v4
        with:
          name: FORK-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
